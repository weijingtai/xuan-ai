name: ai_core_example
description: Example app demonstrating the ai_core package.

publish_to: 'none'

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  ai_core:
    path: ..

  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.2.2

flutter:
  uses-material-design: true
  assets:
    - assets/sql/

dependency_overrides:
  ai_core:
    path: ..
  repository_interface_ai:
    path: ../../repository-interface-ai
  persistence_drift:
    path: ../../xuan-storage/drift
  google_fonts: ^6.2.1
