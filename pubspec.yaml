name: ai_core
description: AI Core module for xuan divination application. Provides LLM integration, prompt management, AI personas, chat system, and multi-agent orchestration.
version: 0.0.1
homepage:

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core utilities
  logger: ^2.6.2
  uuid: 4.5.2
  intl: ^0.20.2
  equatable: ^2.0.8
  json_annotation: ^4.10.0
  crypto: ^3.0.7

  # State management
  provider: ^6.1.5+1

  # Database
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  path_provider: ^2.1.5

  # HTTP & Streaming
  dio: ^5.9.1


  # Storage core (SchemaRegistry, XuanError, etc.)
  persistence_core:
    path: ../xuan-storage/core

  # Storage refactor — interface port (pure; no concrete backend)
  repository_interface_ai:
    git:
      url: http://192.168.0.165:3000/xuan/repository-interface-ai.git
  # TRANSITIONAL (see plan §10): product still references the concrete AiDatabase
  # and its drift-generated data classes from 17 files this wave. Removed once
  # all DAO call-sites move behind repository_interface_ai ports.
  persistence_drift:
    path: ../xuan-storage/drift

  # AI Toolkit
  flutter_ai_toolkit: ^0.9.1
  flutter_ai_providers: ^0.3.4+1
  google_generative_ai: ^0.4.7
  logging: ^1.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  drift_dev: ^2.31.0
  json_serializable: ^6.12.0

dependency_overrides:
  google_fonts: ^6.2.1
  # Required because persistence_drift declares persistence_core via git URL;
  # override to path to match ai_core's own declaration.
  persistence_core:
    path: ../xuan-storage/core

flutter:
  uses-material-design: true
  assets:
    - assets/prompts/
