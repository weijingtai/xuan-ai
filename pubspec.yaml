name: ai_core
description: AI Core module for xuan divination application. Provides LLM integration, prompt management, AI personas, chat system, and multi-agent orchestration.
version: 0.0.1
homepage:

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core utilities
  logger: ^2.6.2
  uuid: 4.5.2
  intl: ^0.20.2
  equatable: ^2.0.8
  json_annotation: ^4.10.0
  crypto: ^3.0.7

  # State management
  provider: ^6.1.5+1

  # Database
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  path_provider: ^2.1.5

  # HTTP & Streaming
  dio: ^5.9.1

  # Shared module
  xuan_common:
    git:
      url: http://xuan:***@192.168.0.165:3000/xuan/xuan-common.git
      ref: main

  # AI Toolkit
  flutter_ai_toolkit: ^0.9.1
  flutter_ai_providers: ^0.3.4+1
  google_generative_ai: ^0.4.7
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.31.0
  json_serializable: ^6.12.0

dependency_overrides:
  google_fonts: ^6.2.1
  # xuan_common 的 persistence_core 来自 git，xuan_four_zhu_card 的来自 hosted——统一到 git
  persistence_core:
    git:
      url: http://192.168.0.165:3000/xuan/xuan-storage.git
      path: core

flutter:
  uses-material-design: true
  assets:
    - assets/prompts/
